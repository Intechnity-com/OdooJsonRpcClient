# Local Odoo instance for integration tests (PortaCapena.OdooJsonRpcClient.Example).
# Matches RequestTestBase.TestConfig: http://localhost:8069, db "db-test", admin / admin.
#
#   docker compose up -d          # start (first run initializes the database, takes a few minutes)
#   docker compose logs -f odoo   # follow logs
#   docker compose down -v        # stop and wipe all data
#
# Odoo 15 is used because the test models (account.account.type, stock.production.lot,
# coupon.program) were removed/renamed in Odoo 16+.

name: odoo-jsonrpc-tests

x-db-env: &db-env
  HOST: db
  USER: odoo
  PASSWORD: odoo

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates "db-test" with demo data, installs modules and runs docker/odoo/seed.py.
  # Skipped if the DB already exists (reset with `docker compose down -v`).
  odoo-init:
    image: odoo:15.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      PGPASSWORD: odoo
      ODOO_DB: db-test
      ODOO_LANGUAGES: en_US,nl_NL,pl_PL
      ODOO_MODULES: >-
        base,contacts,account,l10n_generic_coa,
        sale_management,sale_stock,sale_coupon,coupon,
        purchase,purchase_stock,stock,product_expiry,
        crm,project,hr,mrp
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./docker/odoo:/seed:ro
    entrypoint: ["/bin/bash", "/seed/init.sh"]

  odoo:
    image: odoo:15.0
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    environment:
      <<: *db-env
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
    command: ["odoo", "--db-filter=^db-test$$", "--workers=4", "--max-cron-threads=1", "--limit-time-real=600"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8069/web/login > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
